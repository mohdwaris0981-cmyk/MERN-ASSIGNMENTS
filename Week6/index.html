<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

        <!-- Logo on left -->
        <div class="logo">
            MyCollege
        </div>

        <!-- Links and button on right -->
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Courses</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <button class="login-btn">Login</button>
        </div>

    </nav>

    
<section class="banner">

    <div class="banner-content">
        <h1>Welcome to My College</h1>

        <p>
            Build your future with quality education
            and excellent learning opportunities.
        </p>

        <button class="banner-btn">Explore More</button>
    </div>

</section>


</body>
</html>
