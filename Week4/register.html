<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form">

    <title>Register - My College Website</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <header id="header" class="main-header">
        <h1 class="site-title">Student Registration</h1>
    </header>

    <!-- Navigation Menu -->
    <nav id="navbar" class="navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About</a>
        <a class="nav-link active" href="register.html">Register</a>
        <a class="nav-link" href="contact.html">Contact</a>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="container">

        <!-- Registration Form Section -->
        <section id="registration-section" class="content-section">

            <h2 class="section-title">Registration Form</h2>

            <form id="registration-form" class="registration-form"
                  action="#" method="post">

                <!-- Personal Information -->
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input class="form-input" type="text"
                           id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input class="form-input" type="email"
                           id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input class="form-input" type="password"
                           id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="date">Date of Birth:</label>
                    <input class="form-input" type="date"
                           id="date" name="date">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input class="form-input" type="tel"
                           id="phone" name="phone">
                </div>

                <!-- Gender Selection -->
                <div class="form-group">
                    <p class="form-label">Gender:</p>

                    <input type="radio" id="male"
                           name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female"
                           name="gender" value="Female">
                    <label for="female">Female</label>
                </div>

                <!-- Interests -->
                <div class="form-group">
                    <p class="form-label">Choose Your Interests:</p>

                    <input type="checkbox" id="coding"
                           name="interest" value="Coding">
                    <label for="coding">Coding</label>

                    <input type="checkbox" id="sports"
                           name="interest" value="Sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music"
                           name="interest" value="Music">
                    <label for="music">Music</label>
                </div>

                <!-- Course Selection -->
                <div class="form-group">
                    <label for="course">Select Course:</label>

                    <select class="form-input" id="course"
                            name="course">

                        <option value="">-- Select Course --</option>
                        <option value="CSE">Computer Science</option>
                        <option value="EE">Electrical Engineering</option>
                        <option value="ME">Mechanical Engineering</option>

                    </select>
                </div>

                <!-- Message Box -->
                <div class="form-group">
                    <label for="message">Message:</label>

                    <textarea class="form-input" id="message"
                              name="message" rows="4"></textarea>
                </div>

                <!-- Submit Button -->
                <button class="btn submit-btn" type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

    <!-- Footer Section -->
    <footer id="footer" class="main-footer">
        <p class="footer-text">
            &copy; 2026 My College Website
        </p>
    </footer>

</body>
</html>
