<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact our college">
    <title>Contact - My College Website</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <div class="content">
            <h2>Get in Touch</h2>
            <p>Email: college@example.com</p>
            <p>Phone: 9876543210</p>
            <p>Address: Bareilly, Uttar Pradesh, India</p>

            <h3>Send Us a Message</h3>
            <form action="#" method="post">
                <label for="contact-name">Name:</label>
                <input type="text" id="contact-name"
                       name="name" required>

                <label for="contact-email">Email:</label>
                <input type="email" id="contact-email"
                       name="email" required>

                <label for="contact-message">Message:</label>
                <textarea id="contact-message"
                          name="message" rows="4" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My College Website</p>
    </footer>

</body>
</html>
