<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Flexbox Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Grid and Flexbox Layout</h1>

    <div class="container">

        <header class="head">
            <span class="icon">🏠</span>
            <span>Header</span>
        </header>

        <aside class="side">
            <span class="icon">📋</span>
            <span>Sidebar</span>
        </aside>

        <main class="main">
            <span class="icon">💻</span>
            <span>Main Content</span>
        </main>

        <footer class="foot">
            <span class="icon">📞</span>
            <span>Footer</span>
        </footer>

    </div>

</body>
</html>
