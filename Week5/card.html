<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 40px;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ---------- Original card ---------- */
    .card {
      width: 260px;
      padding: 24px;
      border: 3px solid #555;       /* border */
      border-radius: 16px;          /* round corners */
      background: #ffffff;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* circle avatar: equal width/height + 50% radius */
    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;           /* makes it a circle */
      border: 4px solid #555;
      background: #cfcfcf;
      color: #333;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* If you use a real photo: <img class="avatar" src="photo.jpg" alt="...">
       add this so it fills the circle without stretching */
    img.avatar { object-fit: cover; }

    .card h2 { margin: 0 0 6px; font-size: 22px; color: #333; }
    .card p  { margin: 0; font-size: 15px; color: #666; }

    /* ---------- Colour version 1: Blue ---------- */
    .card.blue {
      background: #e3efff;
      border-color: #1e5fd1;
    }
    .card.blue .avatar { background: #1e5fd1; border-color: #0f3f94; color: #fff; }
    .card.blue h2 { color: #0f3f94; }

    /* ---------- Colour version 2: Green ---------- */
    .card.green {
      background: #e4f6e8;
      border-color: #1f8a3b;
    }
    .card.green .avatar { background: #1f8a3b; border-color: #136127; color: #fff; }
    .card.green h2 { color: #136127; }
  </style>
</head>
<body>
  <div class="cards">

    <!-- Original -->
    <div class="card">
      <div class="avatar">MW</div>
      <h2>Mohammad Waris</h2>
      <p>Web Development Student</p>
    </div>

    <!-- Copy 1: blue -->
    <div class="card blue">
      <div class="avatar">MW</div>
      <h2>Mohammad Waris</h2>
      <p>Web Development Student</p>
    </div>

    <!-- Copy 2: green -->
    <div class="card green">
      <div class="avatar">MW</div>
      <h2>Mohammad Waris</h2>
      <p>Web Development Student</p>
    </div>

  </div>
</body>
</html>
