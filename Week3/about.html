<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Table</title>
</head>
<body>

    <h2>College Events</h2>

    <table border="1" cellpadding="10">
        <!-- Heading Row -->
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
        </thead>

        <!-- Body Rows -->
        <tbody>
            <tr>
                <td>Freshers Party</td>
                <td>10 November 2026</td>
                <td>College Auditorium</td>
            </tr>
            <tr>
                <td>Annual Sports Day</td>
                <td>15 November 2026</td>
                <td>College Ground</td>
            </tr>
            <tr>
                <td>Tech Fest</td>
                <td>20 November 2026</td>
                <td>Computer Lab</td>
            </tr>
        </tbody>

        <!-- Footer Row -->
        <tfoot>
            <tr>
                <td colspan="3">Total Events: 3</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
